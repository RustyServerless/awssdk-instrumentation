[package]
name = "awssdk-instrumentation"
version = "0.3.0"
rust-version = "1.88.0"
edition = "2024"
authors = ["Jérémie RODON <jeremie.rodon@gmail.com>"]
license = "MIT"
description = "Out-of-the-box OpenTelemetry/X-Ray instrumentation for the AWS SDK for Rust, with first-class support for AWS Lambda"
repository = "https://github.com/RustyServerless/awssdk-instrumentation"
documentation = "https://docs.rs/awssdk-instrumentation"
readme = "README.md"
keywords = ["aws", "otel", "xray", "lambda", "serverless"]
categories = ["development-tools::debugging"]
exclude = [
    ".envrc",
    ".hooks/",
    "scripts/",
    ".github/",
    "nix/",
    "AGENTS.md",
    "CONTRIBUTING.md",
]

[dependencies]
log = "0.4"

# Core — always required
aws-smithy-runtime-api = { version = "1", features = ["client"] }
aws-smithy-types = "1"
aws-types = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-semantic-conventions = { version = "0.33" }
# tracing is *always* required because it is the only way to extract the Service.Operation for interceptor
tracing = { version = "0.1"}
tracing-subscriber = { version = "0.3", default-features = false, features = ["smallvec", "registry"] }

# Backend: tracing
tracing-opentelemetry = { version = "0.34", default-features = false, optional = true }

# Environment: Lambda
lambda_runtime = { version = "1", optional = true }
pin-project = { version = "1", optional = true }
tokio = { version = "1", optional = true }

# Extraction: per-service SDK dependencies
aws-sdk-dynamodb = { version = "1", optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-sdk-sqs = { version = "1", optional = true }

# Export: X-Ray
opentelemetry-aws = {  version = "0.21", optional = true }

[features]
default = ["tracing-backend", "env-lambda", "extract-dynamodb", "export-xray"]

# --- Backend features ---
tracing-backend = [
  "dep:tracing-opentelemetry",
  # enables all the default features of tracing-subscriber + json & env-filter
  "tracing-subscriber/fmt",
  "tracing-subscriber/ansi",
  "tracing-subscriber/json",
  "tracing-subscriber/env-filter"
]
otel-backend = []

# --- Environment features ---
env-lambda = ["dep:lambda_runtime", "dep:pin-project", "dep:tokio", "dep:opentelemetry-aws", "opentelemetry-aws/detector-aws-lambda"]
env-ecs = ["dep:opentelemetry-aws", "opentelemetry-aws/detector-aws-ecs"]
env-eks = ["dep:opentelemetry-aws", "opentelemetry-aws/detector-aws-eks"]
env-ec2 = ["dep:opentelemetry-aws", "opentelemetry-aws/detector-aws-ec2"]

# --- Extraction features ---
extract-dynamodb = ["dep:aws-sdk-dynamodb", "dep:serde", "dep:serde_json"]
extract-s3 = ["dep:aws-sdk-s3"]
extract-sqs = ["dep:aws-sdk-sqs"]

# --- Export features ---
export-xray = ["dep:opentelemetry-aws", "opentelemetry-aws/xray-exporter", "opentelemetry-aws/xray-daemon-client"]
xray-no-lambda-node-nesting = []
